 {id:'nope',name:'NOPE',zh:'否决',title:'NOPE · 否决',description:'红色 NOPE 印章砸下，打断正在进行的操作。',duration:2300},
 {id:'attack',name:'Attack',zh:'攻击',title:'ATTACK · 攻击 ×2',description:'两道橙色攻击划向对手，头像闪动并出现 ×2 标记。',duration:2800},
 {id:'targeted',name:'Targeted Attack',zh:'锁定攻击',title:'TARGETED ATTACK · 锁定攻击',description:'准星锁定指定玩家，然后发射攻击光束与弹道。',duration:3200},
 {id:'alter',name:'Alter the Future',zh:'改变未来',title:'ALTER THE FUTURE · 改变未来',description:'紫色涟漪展开三张未来牌，牌的位置重新排列。',duration:3500},
 {id:'peek',name:'See the Future',zh:'预见未来',title:'SEE THE FUTURE · 预见未来',description:'三张未来牌依次展开，查看后收起，不改变顺序。',duration:3200},
 {id:'shuffle',name:'Shuffle',zh:'洗牌',title:'SHUFFLE · 洗牌',description:'红色牌背左右交错，旋转后重新叠回牌堆。',duration:2800},
 {id:'skip',name:'Skip',zh:'跳过',title:'SKIP · 跳过',description:'金色箭头划过牌桌，回合亮光转移给下一位玩家。',duration:2500},
 {id:'favor',name:'Favor',zh:'索取卡牌',title:'FAVOR · 索取卡牌',description:'一张牌从对手头像旁飞入你的手牌位置。',duration:2600},
 {id:'bottom',name:'Draw from Bottom',zh:'从底部抽牌',title:'DRAW FROM BOTTOM · 从底部抽牌',description:'一张牌从抽牌堆底部滑出，再飞向你的手牌。',duration:2800},
 {id:'defuse',name:'Defuse',zh:'拆弹',title:'DEFUSE · 拆弹成功',description:'剪刀剪断引线，火花熄灭，绿色安全光环亮起。',duration:3400}
 ];
 const $=s=>document.querySelector(s),scene=$('#scene'),image=$('#cardImage'),effects=$('#effects'),picker=$('#picker'),status=$('#status'),allButton=$('#playAll');
 let selected='nope',generation=0,all=false;
 const query=new URLSearchParams(location.search).get('card');if(cards.some(c=>c.id===query))selected=query;
 picker.innerHTML=cards.map(c=>'<button class="pick" type="button" data-card="'+c.id+'" aria-pressed="'+(c.id===selected)+'"><strong>'+c.name+'</strong>'+c.zh+'</button>').join('');
 $('#cardSelect').innerHTML=cards.map(c=>'<option value="'+c.id+'">'+c.name+' · '+c.zh+'</option>').join('');$('#cardSelect').value=selected;
 const back='<img src="/art/back.jpg" alt="">';
 function sparks(color,delay){return Array.from({length:18},(_,i)=>{const angle=i*Math.PI*2/18,reach=85+(i%3)*24;return '<i class="speck" style="--spark:'+color+';--delay:'+delay+'s;--dx:'+Math.cos(angle)*reach+'px;--dy:'+Math.sin(angle)*reach+'px;--rot:'+i*39+'deg"></i>'}).join('')}
 function markup(type){
  if(type==='nope')return '<div class="stamp">NOPE!</div>'+sparks('#ff9d88',.6);
  if(type==='attack')return '<div class="slash"></div><div class="slash second"></div><div class="attack-wave"></div>'+sparks('#ffba68',.9);
  if(type==='targeted')return '<div class="target-label">TARGET LOCKED · 已锁定</div><div class="beam"></div><div class="missile"></div>'+sparks('#ff9b72',1.7);
  if(type==='alter'||type==='peek'){const shift=globalThis.innerWidth<651?66:80;return '<div class="future-glow"></div><div class="future-orbit"></div>'+(type==='alter'?'<div class="future-arrow">↻</div>':'')+['skip','boom','nope'].map((c,i)=>'<div class="future-card" style="--start:'+(i-1)*shift+'px;--end:'+([1,-1,0][i]*shift)+'px;--lift:'+(i===0?-45:22)+'px;--tilt:'+(i===0?-12:8)+'deg"><img src="/art/'+c+'.jpg" alt=""><em>'+(i+1)+'</em></div>').join('')}
  if(type==='shuffle')return Array.from({length:6},(_,i)=>'<div class="shuffle-card" style="--spread:'+((i-2.5)*24)+'px;--lift:'+((i%2?1:-1)*26)+'px;--tilt:'+((i-2.5)*13)+'deg;--stack:'+(i*2)+'px">'+back+'</div>').join('');
  if(type==='skip')return '<div class="skip-chevrons"><i></i><i></i><i></i></div><div class="stamp gold">SKIP</div>';
  if(type==='favor')return '<div class="favor-thread"></div><div class="flight-card">'+back+'</div>'+sparks('#ffcc66',1.5);
  if(type==='bottom')return '<div class="bottom-mark">↓</div><div class="bottom-card">'+back+'</div>';
  return '<div class="bomb"></div><div class="fuse"></div><div class="wire"></div><div class="scissors">✂</div><div class="safe-ring"></div><div class="stamp green">DEFUSED ✓</div>'+sparks('#b1efc4',1.6);
 }
 function stopAll(){all=false;allButton.textContent='连续预览全部'}
 async function play(id,chain=false){
  if(!chain)stopAll();selected=id;$('#cardSelect').value=id;const card=cards.find(c=>c.id===id),token=++generation;
  scene.classList.remove('playing','reduced');scene.dataset.effect=id;effects.innerHTML='';image.src='/art/'+id+'.jpg';image.alt=card.name+' 卡牌';$('#effectTitle').textContent=card.title;$('#effectDescription').textContent=card.description;status.textContent='准备播放…';
  document.querySelectorAll('[data-card]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.card===id)));
  try{if(image.decode)await image.decode()}catch{}
  if(token!==generation)return;
  effects.innerHTML=markup(id);const reduced=!!globalThis.matchMedia?.('(prefers-reduced-motion: reduce)').matches;if(reduced)scene.classList.add('reduced');void scene.offsetWidth;scene.classList.add('playing');
  status.textContent=(chain?(cards.findIndex(c=>c.id===id)+1)+' / '+cards.length+' · ':'')+'播放中';
  setTimeout(()=>{if(token!==generation)return;status.textContent='预览结束 · 可重播';if(all){const next=cards.findIndex(c=>c.id===id)+1;if(next<cards.length)play(cards[next].id,true);else{stopAll();status.textContent='全部预览完成'}}},reduced?1000:card.duration);
 }
 document.querySelectorAll('[data-card]').forEach(b=>b.addEventListener('click',()=>play(b.dataset.card)));
 $('#cardSelect').addEventListener('change',e=>play(e.target.value));
 $('#replay').addEventListener('click',()=>play(selected));
 allButton.addEventListener('click',()=>{if(all){stopAll();return}all=true;allButton.textContent='停止连续预览';play(cards[0].id,true)});
 window.addEventListener('load',()=>play(selected),{once:true});
})();
</script>
</main></body></html>
