<body><main>
<header><div><h1>卡牌特效预览</h1><p>10 种功能牌 · 不含猫咪牌 · 无音效</p></div><a href="/">返回游戏 ↗</a></header>
<nav class="picker" id="picker" aria-label="选择预览卡牌"></nav><label class="mobile-picker" for="cardSelect">选择预览卡牌<select id="cardSelect"></select></label>
<section class="stage" id="scene" data-effect="nope" aria-label="卡牌动画演示">
<div class="felt"></div><div class="watermark">KITTEN KABOOM</div>
<div class="person opponent"><div class="avatar"><div class="target-reticle"><i></i></div><span class="debt">×2</span></div><span class="person-name">Mittens · BOT</span></div>
<div class="pile"><div class="deck-stack"><img src="/art/back.jpg" alt="抽牌堆"></div><span class="pile-label">DRAW PILE</span></div><div class="discard-slot">DISCARD</div>
<div class="played-card"><img id="cardImage" src="/art/back.jpg" alt="卡牌背面"></div>
<div class="person self"><div class="avatar"></div><span class="person-name">YOU</span></div>
<div class="fx" id="effects" aria-hidden="true"></div>
</section>
<div class="caption"><div><h2 id="effectTitle">NOPE · 否决</h2><p id="effectDescription">红色 NOPE 印章砸下，打断正在进行的操作。</p></div><span class="status" id="status" role="status" aria-live="polite">准备播放</span></div>
<div class="controls"><button class="primary" id="replay" type="button">重播当前特效</button><button class="secondary" id="playAll" type="button">连续预览全部</button></div>
<p class="note">先选一个动作查看效果，或连续播放全部。公用特效不展示任何私密牌面；这批功能牌特效尚未加入正式对局。<a href="/preview/explosion">查看爆炸特效 ↗</a></p>

 function defuseMarkup(){return '<div class="defuse-scene"><div class="defuse-aura"></div><svg class="defuse-art" viewBox="0 0 320 280"><defs><radialGradient id="bombmetal" cx=".3" cy=".25"><stop stop-color="#77778a"/><stop offset=".35" stop-color="#393746"/><stop offset="1" stop-color="#12121d"/></radialGradient><linearGradient id="blade" x2="1" y2="1"><stop stop-color="#fff9e8"/><stop offset=".5" stop-color="#b6cbd4"/><stop offset="1" stop-color="#567488"/></linearGradient><linearGradient id="safe" x2="1" y2="1"><stop stop-color="#d6ffdf"/><stop offset="1" stop-color="#5bc69a"/></linearGradient></defs><ellipse cx="160" cy="232" rx="80" ry="13" fill="#180713" opacity=".5"/><circle class="defuse-halo" cx="160" cy="143" r="86" fill="none" stroke="#9ce4bd" stroke-width="2"/><g class="defuse-bomb"><path d="M154 86L152 64L178 59L185 82" fill="#635569" stroke="#a79aa5" stroke-width="2"/><path d="M171 65C171 37 221 35 228 57" fill="none" stroke="#eac083" stroke-width="4" stroke-linecap="round"/><g class="fuse-spark"><path d="M230 43L234 53L245 55L235 59L231 69L227 59L216 56L226 53Z" fill="#ffd784"/><circle cx="230" cy="56" r="17" fill="#ffb85e" opacity=".15"/></g><circle cx="160" cy="144" r="65" fill="url(#bombmetal)" stroke="#8a7486" stroke-width="2"/><path d="M116 119Q126 95 148 95" fill="none" stroke="#dbd7db" stroke-opacity=".5" stroke-width="7" stroke-linecap="round"/><path d="M200 128Q214 171 184 192" fill="none" stroke="#120e1b" stroke-width="7" stroke-linecap="round"/><path d="M117 117C80 125 75 153 91 175Q103 193 122 174" fill="none" stroke="#642233" stroke-width="8" stroke-linecap="round"/><path class="red-lead" d="M117 117C80 125 75 153 91 175Q103 193 122 174" fill="none" stroke="#f08079" stroke-width="4" stroke-linecap="round"/><path d="M190 114C231 121 239 174 198 183" fill="none" stroke="#4898b3" stroke-width="4" stroke-linecap="round"/><rect x="133" y="132" width="54" height="31" rx="5" fill="#110f18" stroke="#776b7a" stroke-width="2"/><g fill="#ff8578" font-family="monospace" font-size="20" text-anchor="middle"><text class="timer-three" x="160" y="155">03</text><text class="timer-two" x="160" y="155">02</text><text class="timer-one" x="160" y="155">01</text></g><path class="safe-tick" d="M147 148L156 156L174 139" stroke="#b1f4c6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path class="cut-lead" d="M91 174Q101 191 122 174" stroke="#f08079" stroke-width="4" fill="none" stroke-linecap="round"/></g><g class="precision-scissors"><g class="shear-left"><path d="M90 173L124 126Q126 153 94 176Z" fill="url(#blade)" stroke="#b8cbd5"/><ellipse cx="72" cy="198" rx="13" ry="20" transform="rotate(32 72 198)" fill="none" stroke="#ce8c68" stroke-width="8"/><path d="M79 184L92 172" stroke="#ce8c68" stroke-width="8"/></g><g class="shear-right"><path d="M90 173L131 149Q120 177 93 178Z" fill="url(#blade)" stroke="#b8cbd5"/><ellipse cx="60" cy="186" rx="12" ry="19" transform="rotate(55 60 186)" fill="none" stroke="#ebbc87" stroke-width="8"/><path d="M74 181L91 173" stroke="#ebbc87" stroke-width="8"/></g><circle cx="91" cy="173" r="5" fill="#edf1e4" stroke="#667785" stroke-width="2"/></g><path class="safe-shield" d="M160 58L235 86V141Q235 208 160 239Q85 208 85 141V86Z" fill="none" stroke="url(#safe)" stroke-width="3" stroke-dasharray="550" stroke-dashoffset="550"/><g class="snip-flash" stroke="#ffdf9c" stroke-width="3" stroke-linecap="round"><path d="M76 160L67 151M83 151L82 141M99 159L108 151"/></g></svg><div class="safe-banner">DEFUSED ✓</div></div>'}

 function markup(type){
  if(type==='nope')return '<div class="stamp">NOPE!</div>'+sparks('#ff9d88',.6);
  if(type==='attack')return '<div class="slash"></div><div class="slash second"></div><div class="attack-wave"></div>'+sparks('#ffba68',.9);
  if(type==='targeted')return '<div class="target-label">TARGET LOCKED · 已锁定</div><div class="beam"></div><div class="missile"></div>'+sparks('#ff9b72',1.7);
  if(type==='alter')return wizardMarkup()+sparks('#d9bbff',1.1);
  if(type==='peek')return eyeMarkup();
  if(type==='shuffle')return Array.from({length:6},(_,i)=>'<div class="shuffle-card" style="--spread:'+((i-2.5)*24)+'px;--lift:'+((i%2?1:-1)*26)+'px;--tilt:'+((i-2.5)*13)+'deg;--stack:'+(i*2)+'px">'+back+'</div>').join('');
  if(type==='skip')return '<div class="skip-chevrons"><i></i><i></i><i></i></div><div class="stamp gold">SKIP</div>';
  if(type==='favor')return '<div class="favor-thread"></div><div class="favor-heart"><svg viewBox="0 0 64 60"><path d="M32 55C26 50 4 35 4 19C4 2 25-2 32 13C39-2 60 2 60 19C60 35 38 50 32 55Z" fill="#10090f" stroke="#d5a2b0" stroke-opacity=".6" stroke-width="1.5"/><path d="M13 15Q19 7 25 15" fill="none" stroke="#805268" stroke-width="3" stroke-linecap="round"/></svg></div>';
  if(type==='bottom')return '<div class="bottom-card">'+back+'</div>';
  return defuseMarkup()+sparks('#b1efc4',2);
 }
 function stopAll(){all=false;allButton.textContent='连续预览全部'}
 async function play(id,chain=false){
  if(!chain)stopAll();selected=id;$('#cardSelect').value=id;const card=cards.find(c=>c.id===id),token=++generation;
  scene.classList.remove('playing','reduced');scene.dataset.effect=id;effects.innerHTML='';image.src='/art/back.jpg';image.alt='公用特效只展示牌背';$('#effectTitle').textContent=card.title;$('#effectDescription').textContent=card.description;status.textContent='准备播放…';
  document.querySelectorAll('[data-card]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.card===id)));
  try{if(image.decode)await image.decode()}catch{}
  if(token!==generation)return;
  effects.innerHTML=markup(id);const reduced=!!globalThis.matchMedia?.('(prefers-reduced-motion: reduce)').matches;if(reduced)scene.classList.add('reduced');void scene.offsetWidth;scene.classList.add('playing');
  status.textContent=(chain?(cards.findIndex(c=>c.id===id)+1)+' / '+cards.length+' · ':'')+'播放中';
  setTimeout(()=>{if(token!==generation)return;status.textContent='预览结束 · 可重播';if(all){const next=cards.findIndex(c=>c.id===id)+1;if(next<cards.length)play(cards[next].id,true);else{stopAll();status.textContent='全部预览完成'}}},reduced?1000:card.duration);
 }
 document.querySelectorAll('[data-card]').forEach(b=>b.addEventListener('click',()=>play(b.dataset.card)));
 $('#cardSelect').addEventListener('change',e=>play(e.target.value));
 $('#replay').addEventListener('click',()=>play(selected));
 allButton.addEventListener('click',()=>{if(all){stopAll();return}all=true;allButton.textContent='停止连续预览';play(cards[0].id,true)});
 window.addEventListener('load',()=>play(selected),{once:true});
})();
</script>
